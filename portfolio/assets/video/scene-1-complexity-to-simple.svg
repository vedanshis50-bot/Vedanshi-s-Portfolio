<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E0E0D"/>
      <stop offset="55%" stop-color="#1B1A18"/>
      <stop offset="100%" stop-color="#3a3a2f"/>
    </linearGradient>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2"/><feColorMatrix type="saturate" values="0"/></filter>
    <radialGradient id="glow1" cx="30%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#8E82B0" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8E82B0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="75%" cy="65%" r="45%">
      <stop offset="0%" stop-color="#6F7D52" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6F7D52" stop-opacity="0"/>
    </radialGradient>
    <style>
      @keyframes driftA { 0%,100% { transform: translate(0,0) rotate(0deg);} 50% { transform: translate(14px,-10px) rotate(3deg);} }
      @keyframes driftB { 0%,100% { transform: translate(0,0);} 50% { transform: translate(-10px,12px);} }
      @keyframes driftC { 0%,100% { transform: translate(0,0);} 50% { transform: translate(8px,8px);} }
      @keyframes pulseGlow { 0%,100% { opacity: 0.55; r: 6;} 50% { opacity: 1; r: 9;} }
      @keyframes pulseGlowSm { 0%,100% { opacity: 0.5; r: 5;} 50% { opacity: 0.95; r: 7.5;} }
      @keyframes lineDraw { 0% { stroke-dashoffset: 60; } 50% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: -60; } }
      .grpA { animation: driftA 9s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .grpB { animation: driftB 11s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .grpC { animation: driftC 7.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .glowLg { animation: pulseGlow 4s ease-in-out infinite; }
      .glowSm { animation: pulseGlowSm 5s ease-in-out infinite; }
      .glowSm2 { animation: pulseGlowSm 6s ease-in-out infinite 1.2s; }
      .ln { stroke-dasharray: 8 6; animation: lineDraw 6s linear infinite; }
    </style>
  </defs>
  <rect width="1920" height="1080" fill="url(#g1)"/>
  <rect width="1920" height="1080" fill="url(#glow1)"/>
  <rect width="1920" height="1080" fill="url(#glow2)"/>
  <rect width="1920" height="1080" filter="url(#grain)" opacity="0.05"/>
  <g stroke="#F6F3EC" stroke-opacity="0.22" stroke-width="1.5" fill="none">
    <line class="ln" x1="420" y1="300" x2="720" y2="420"/>
    <line class="ln" x1="720" y1="420" x2="980" y2="360"/>
    <line class="ln" x1="980" y1="360" x2="1280" y2="540"/>
    <line class="ln" x1="640" y1="700" x2="980" y2="360"/>
    <line class="ln" x1="1280" y1="540" x2="1520" y2="480"/>
  </g>
  <g class="grpA"><circle class="glowLg" cx="420" cy="300" r="6" fill="#C9C0E0"/></g>
  <g class="grpB"><circle class="glowLg" cx="980" cy="360" r="7" fill="#C9C0E0"/></g>
  <g class="grpC"><circle class="glowSm" cx="1280" cy="540" r="8" fill="#C9C0E0"/></g>
  <g class="grpB"><circle class="glowSm" cx="720" cy="420" r="5" fill="#A3B47C"/></g>
  <g class="grpC"><circle class="glowSm2" cx="640" cy="700" r="5" fill="#A3B47C"/></g>
  <g class="grpA"><circle class="glowSm2" cx="1520" cy="480" r="6" fill="#A3B47C"/></g>
  <text x="80" y="1000" font-family="monospace" font-size="20" letter-spacing="3" fill="#9B968A" opacity="0.8">MAKING COMPLEXITY SIMPLE</text>
</svg>
