<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E0E0D"/>
      <stop offset="100%" stop-color="#1B1A18"/>
    </linearGradient>
    <filter id="grain3"><feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2"/><feColorMatrix type="saturate" values="0"/></filter>
    <style>
      @keyframes nodePulse { 0%,100% { opacity: 0.75; } 50% { opacity: 1; } }
      @keyframes centerPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }
      @keyframes lineFlow { 0% { stroke-dashoffset: 40; } 100% { stroke-dashoffset: 0; } }
      .center { animation: centerPulse 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .n1 { animation: nodePulse 3.6s ease-in-out infinite; }
      .n2 { animation: nodePulse 3.6s ease-in-out infinite 0.6s; }
      .n3 { animation: nodePulse 3.6s ease-in-out infinite 1.2s; }
      .n4 { animation: nodePulse 3.6s ease-in-out infinite 1.8s; }
      .flow { stroke-dasharray: 6 6; animation: lineFlow 2.4s linear infinite; }
    </style>
  </defs>
  <rect width="1920" height="1080" fill="url(#g3)"/>
  <rect width="1920" height="1080" filter="url(#grain3)" opacity="0.05"/>
  <g class="flow" stroke="#F6F3EC" stroke-opacity="0.22" stroke-width="1.2" fill="none">
    <line x1="960" y1="540" x2="700" y2="380"/>
    <line x1="960" y1="540" x2="1220" y2="380"/>
    <line x1="960" y1="540" x2="700" y2="700"/>
    <line x1="960" y1="540" x2="1220" y2="700"/>
    <line x1="700" y1="380" x2="480" y2="300"/>
    <line x1="1220" y1="380" x2="1440" y2="300"/>
    <line x1="700" y1="700" x2="480" y2="780"/>
    <line x1="1220" y1="700" x2="1440" y2="780"/>
  </g>
  <rect class="center" x="922" y="502" width="76" height="76" rx="10" fill="#1B1A18" stroke="#C9C0E0" stroke-width="1.5"/>
  <g fill="#232220" stroke="#F6F3EC" stroke-opacity="0.3" stroke-width="1">
    <rect class="n1" x="664" y="344" width="72" height="72" rx="8"/>
    <rect class="n2" x="1184" y="344" width="72" height="72" rx="8"/>
    <rect class="n3" x="664" y="664" width="72" height="72" rx="8"/>
    <rect class="n4" x="1184" y="664" width="72" height="72" rx="8"/>
  </g>
  <g fill="#A3B47C">
    <circle class="n2" cx="480" cy="300" r="6"/>
    <circle class="n4" cx="1440" cy="780" r="6"/>
  </g>
  <g fill="#C9C0E0">
    <circle class="n1" cx="1440" cy="300" r="6"/>
    <circle class="n3" cx="480" cy="780" r="6"/>
  </g>
  <text x="80" y="1000" font-family="monospace" font-size="20" letter-spacing="3" fill="#9B968A" opacity="0.8">SYSTEMS THAT SCALE</text>
</svg>
